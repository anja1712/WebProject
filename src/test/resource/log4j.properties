#to perform full logging uncomment this logger and comment out the active one
log4j.rootLogger=INFO, BANK, CONSOLE

log4j.appender.BANK=org.apache.log4j.DailyRollingFileAppender
log4j.appender.BANK.datePattern='.'yyyy-MM-dd
log4j.appender.BANK.file= logs/BANK.log
log4j.appender.BANK.additivity=false
log4j.appender.BANK.layout=org.apache.log4j.PatternLayout
log4j.appender.BANK.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c: %m%n

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Threshold=debug
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern==%d{ISO8601} %t %-5p %C{1}: %m%n

log4j.logger.org.springframework=ERROR
log4j.logger.org.apache=ERROR