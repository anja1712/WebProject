server:
    servlet:
        context-path: /bank/api
    port: 8080
    compression:
        enabled: true
spring:
    sql:
        init:
            mode: always
    main:
        banner-mode: "off"
    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/bank_db
        username: bank007
        password: 123456
        tomcat:
            initialSize: 1
            minIdle: 1
            maxIdle: 3
            maxActive: 3
            maxWait: 2000
            validationQuery: "/* Health Check */ SELECT 1"
            validationQueryTimeout: 3
            testWhileIdle: true
    jpa:
        database: POSTGRESQL
        openInView: false
        show_sql: false
        generate-ddl: false
        hibernate:
            ddl-auto: none
        properties:
            hibernate.generate_statistics: false
            hibernate.boot.allow_jdbc_metadata_access: true
            hibernate:
                default_schema: bank
    mail:
        host: smtp.gmail.com # Your SMTP server host (e.g., smtp.gmail.com for Gmail)
        port: 587 # The port for your SMTP server (587 for TLS/STARTTLS, 465 for SSL)
        username: TVOJA_EMAIL_ADRESA
        password: APP_PASSWORD
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
management:
    endpoints:
        web:
            exposure:
                include: env,info,health,httptrace,logfile,metrics,mappings,shutdown,swagger
        shutdown:
            sensitive: false
            enabled: true
    endpoint:
        shutdown:
            enabled: true
        info:
            enabled: true
    security:
        enabled: false
logging:
    #config: classpath:log4j.properties
    level:
        com.bank: INFO
        org.springframework: INFO
endpoints:
    shutdown:
        sensitive: false
        enabled: true